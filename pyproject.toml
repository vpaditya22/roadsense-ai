[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense-ai"
version = "0.1.0"
description = "A transparent road issue reporting and repair triage portfolio prototype"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2.0", "pandas>=2.2,<4.0", "plotly>=5.24,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["roadsense*"]
